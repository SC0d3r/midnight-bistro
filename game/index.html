<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Midnight Bistro</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #08060a;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 40%, #17111c 0%, #08060a 70%);
      }
      canvas {
        display: block;
        width: 1280px;
        height: 720px;
        box-shadow: 0 18px 80px rgba(0, 0, 0, 0.7);
        image-rendering: auto;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="Midnight Bistro, a tiny rooftop cooking game"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
